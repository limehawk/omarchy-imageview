[package]
name = "omarchy-imageview"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
image = { version = "0.25", features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "avif"] }
toml = "0.8"
sha2 = "0.10"
natord = "1.0"
kamadak-exif = "0.5"
dirs = "5.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
