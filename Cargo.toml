[package]
name = "omarchy-imageview"
version = "0.3.1"
edition = "2021"
description = "Image viewer and browser for the Omarchy desktop"
license = "MIT"
repository = "https://github.com/limehawk/omarchy-imageview"
homepage = "https://github.com/limehawk/omarchy-imageview"
readme = "README.md"
authors = ["Limehawk <128890849+limehawk@users.noreply.github.com>"]
keywords = ["image-viewer", "gtk4", "wayland", "omarchy"]
categories = ["multimedia"]

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
image = { version = "0.25", default-features = false, features = ["default-formats"] }
libheif-rs = { version = "2", default-features = false, features = ["v1_21"] }
jxl-oxide = "0.12"
toml = "0.8"
sha2 = "0.10"
natord = "1.0"
kamadak-exif = "0.5"
dirs = "5.0"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
