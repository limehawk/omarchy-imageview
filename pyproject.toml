[project]
name = "omarchy-imageview"
version = "0.1.0"
description = "Image viewer/browser for the Omarchy desktop"
requires-python = ">=3.11"
dependencies = [
    "pillow-heif",
    "rawpy",
    "natsort",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
